name: Publish road weather PNG
on:
  schedule:
    - cron: '0 23 * * *' # 08:00 KST
    - cron: '0 9 * * *'  # 18:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/share-briefing.yml']
permissions:
  contents: write
concurrency:
  group: publish-road-weather-png
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install image tools and Korean fonts
        run: |
          python -m pip install 'Pillow>=11,<14' 'playwright>=1.55,<2'
          if ! fc-list :lang=ko | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Render the current edition
        run: |
          case "${{ github.event.schedule }}" in
            '0 23 * * *') python scripts/publish-share.py --slot morning ;;
            '0 9 * * *') python scripts/publish-share.py --slot night ;;
            *) python scripts/publish-share.py ;;
          esac
      - name: Publish the completed image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/share/morning.png public/share/night.png public/share/morning.json public/share/night.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh scheduled road weather PNG'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
