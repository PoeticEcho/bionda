name = "bionda"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-01"

[observability]
enabled = true

[vars]
ROAD_LINE_CODE = "14"

# 비밀 키는 여기에 적지 말고 Cloudflare 대시보드(Settings > Variables and Secrets)
# 또는 `npx wrangler secret put KMA_SERVICE_KEY`로 등록하세요:
# - KMA_SERVICE_KEY (필수)
# - KMA_RADAR_KEY   (선택, 미입력 시 KMA_SERVICE_KEY 공용)
# - KMA_ROAD_KEY    (선택, 미입력 시 KMA_SERVICE_KEY 공용)
# - ITS_API_KEY     (선택, /api/cctv 국가교통정보센터 ITS Open API 인증키)
# - CCTV_SOURCE_URL (선택, 9443 포트 우회용 외부 CCTV JSON 주소)
# - CORS_ORIGINS    (선택, 예: "https://poeticecho.github.io")
